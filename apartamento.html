<style>
:root{
  --ocean:#0c4a6e; --ocean-light:#0ea5e9; --sand:#fef3c7; --sand-dark:#f59e0b;
  --ink:#0f2233; --muted:#5b7185; --line:#dde5ec; --bg:#f7f9fb; --card:#fff;
  --wa:#25d366;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e8eef4; --muted:#9db0c2; --line:#22364a; --bg:#0b1622; --card:#12222f;
  }
}
:root[data-theme="dark"]{--ink:#e8eef4;--muted:#9db0c2;--line:#22364a;--bg:#0b1622;--card:#12222f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
     -webkit-font-smoothing:antialiased}
header{background:linear-gradient(160deg,var(--ocean),#08334d);color:#fff;padding:34px 20px 30px;text-align:center}
header .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);margin:0 0 10px;font-weight:600}
header h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(25px,6.5vw,40px);
          margin:0 0 12px;line-height:1.14;text-wrap:balance}
header p{margin:0 auto;max-width:46ch;color:#c3dced;font-size:15px;line-height:1.6}
main{max-width:1180px;margin:0 auto;padding:26px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.c{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
   cursor:zoom-in;transition:transform .18s ease,box-shadow .18s ease}
.c:hover,.c:focus-within{transform:translateY(-3px);box-shadow:0 10px 26px rgba(9,40,64,.16)}
.c img{display:block;width:100%;height:172px;object-fit:cover;background:var(--line)}
.c figcaption{padding:10px 12px 12px;font-size:13px;line-height:1.4;color:var(--muted)}
.cta{margin:34px auto 0;max-width:600px;background:var(--card);border:1px solid var(--line);
     border-radius:14px;padding:24px;text-align:center}
.cta h2{margin:0 0 8px;font-family:Georgia,serif;font-weight:400;font-size:21px}
.cta p{margin:0 0 18px;color:var(--muted);font-size:14.5px;line-height:1.6}
.cta a{display:inline-block;background:var(--wa);color:#fff;text-decoration:none;padding:13px 26px;
       border-radius:9px;font-weight:600;font-size:15px}
footer{text-align:center;padding:26px 18px 40px;color:var(--muted);font-size:12.5px;line-height:1.65}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(5,17,28,.94);display:none;align-items:center;justify-content:center;
    z-index:50;padding:16px;flex-direction:column;gap:14px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:82vh;border-radius:8px;object-fit:contain}
#lb .leg{color:#dbe8f2;font-size:14px;text-align:center;max-width:56ch}
#lb button{position:absolute;background:rgba(255,255,255,.14);color:#fff;border:0;width:46px;height:46px;
           border-radius:50%;font-size:24px;cursor:pointer;line-height:1}
#lbx{top:14px;right:14px}#lbp{left:10px;top:50%;transform:translateY(-50%)}#lbn{right:10px;top:50%;transform:translateY(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:9px}.c img{height:124px}
  .c figcaption{font-size:11.5px;padding:8px 9px 10px}}
</style>
</head>
<body>

<main>
  <div class="grid">
<figure class="c gal-slot"><img src="fotos/unidades/7406/01.webp" alt="A sala e a varanda" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">A sala e a varanda</figcaption></figure>
<figure class="c gal-slot"><img src="fotos/unidades/7406/02.webp" alt="A TV giratória entre a sala e o quarto" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">A TV giratória entre a sala e o quarto</figcaption></figure>
<figure class="c gal-slot"><img src="fotos/unidades/7406/03.webp" alt="A cozinha completa" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">A cozinha completa</figcaption></figure>
<figure class="c gal-slot"><img src="fotos/unidades/7406/04.webp" alt="O quarto social, com saída para a varanda" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">O quarto social, com saída para a varanda</figcaption></figure>

<figure class="c gal-slot"><img src="fotos/unidades/7406/06.webp" alt="O quarto de casal, com painel de freijó" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">O quarto de casal, com painel de freijó</figcaption></figure>

<figure class="c gal-slot"><img src="fotos/unidades/7406/08.webp" alt="A vista da varanda" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">A vista da varanda</figcaption></figure>
<figure class="c gal-slot"><img src="fotos/unidades/7406/09.webp" alt="A mesa posta" loading="lazy" decoding="async" width="480" height="360"><figcaption class="gal-cap">A mesa posta</figcaption></figure>

       Esta página é mandada para quem JÁ está conversando com ele — o botão
       repetia um caminho que o hóspede já percorreu, e ainda apontava para o
       número do bot enquanto o atendimento estava em mãos humanas.

</main>
<footer>Polinésia Resort · Muro Alto, Ipojuca-PE<br>Apartamento 2 quartos · <a href="areas-comuns.html" style="color:inherit">ver as áreas comuns</a></footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button id="lbx" aria-label="Fechar">&times;</button>
  <button id="lbp" aria-label="Anterior">&#8249;</button>
  <button id="lbn" aria-label="Próxima">&#8250;</button>
  <img id="lbi" alt=""><div class="leg" id="lbl"></div>
</div>
<script>
(function(){
  var figs=[].slice.call(document.querySelectorAll('.c')), i=0,
      lb=document.getElementById('lb'), im=document.getElementById('lbi'), lg=document.getElementById('lbl');
  function show(n){
    i=(n+figs.length)%figs.length;
    var f=figs[i], img=f.querySelector('img');
    im.src=img.dataset.full||img.src; im.alt=img.alt; lg.textContent=img.alt;
    lb.classList.add('on'); document.body.style.overflow='hidden';
  }
  function hide(){lb.classList.remove('on'); im.src=''; document.body.style.overflow='';}
  figs.forEach(function(f,n){f.addEventListener('click',function(){show(n);});});
  document.getElementById('lbx').onclick=hide;
  document.getElementById('lbp').onclick=function(e){e.stopPropagation();show(i-1);};
  document.getElementById('lbn').onclick=function(e){e.stopPropagation();show(i+1);};
  lb.addEventListener('click',function(e){if(e.target===lb)hide();});
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('on'))return;
    if(e.key==='Escape')hide(); if(e.key==='ArrowLeft')show(i-1); if(e.key==='ArrowRight')show(i+1);
  });
  var x0=null;
  lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  lb.addEventListener('touchend',function(e){
    if(x0===null)return; var d=e.changedTouches[0].clientX-x0;
    if(Math.abs(d)>44) show(d<0?i+1:i-1); x0=null;
  },{passive:true});
})();
</script>
</body>
