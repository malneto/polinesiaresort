<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada — Polinésia Resort</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c4a6e 0%, #0369a1 40%, #0ea5e9 100%);
            color: #fff;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 520px;
        }
        .palm {
            font-size: 5rem;
            margin-bottom: 1rem;
            display: block;
        }
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .code {
            font-family: 'Inter', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            opacity: 0.2;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .btn-home {
            display: inline-block;
            padding: 0.9rem 2.4rem;
            background: #fff;
            color: #0c4a6e;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="palm" aria-hidden="true">🌴</span>
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>Parece que esta página pegou um barco e foi para as piscinas naturais. Volte para a página principal e encontre o que procura.</p>
        <a href="/" class="btn-home">Voltar ao início</a>
    </div>
</body>
</html>
